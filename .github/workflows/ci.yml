name: checks

# Pushes and pull requests run exactly what the pre-commit hook runs, so
# "it passed locally" and "it passed in CI" mean the same thing. The gates
# themselves live in scripts/checks.sh, not here: a workflow that duplicates
# them is a second definition that drifts.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The dead-code and duplication checks read the repository, and the
          # code-budget check counts committed lines. Depth 1 is enough; the
          # checkpoint reader needs refs only when profiling, not when
          # testing.
          #
          # One gate is weaker here than in the hook, and deliberately: the
          # private-name check needs .private-names, which is gitignored so
          # that a public repository does not publish the list it protects.
          # CI therefore runs the generic patterns only, and the
          # commit-message scan -- the part that would want full history --
          # does not run at all. See AGENTS.md.
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # checks.sh skips golangci-lint when it is not on PATH, so without this
      # the lint gate printed "skipped" and the run went green having linted
      # nothing -- on every run this repository has ever had.
      #
      # Installed here rather than run here. golangci-lint-action would lint
      # as well as install, which would make the workflow a second definition
      # of a gate that lives in scripts/checks.sh, and the two would drift.
      #
      # Pinned, and the release binary rather than a piped install script:
      # a new release of the linter must not change the verdict on an
      # unchanged commit, for the same reason deadcode is a pinned tool
      # dependency.
      - name: install golangci-lint
        env:
          VERSION: 2.13.2
        run: |
          set -euo pipefail
          archive="golangci-lint-${VERSION}-linux-amd64"
          curl -sSfL -o /tmp/golangci-lint.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/v${VERSION}/${archive}.tar.gz"
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          sudo install "/tmp/${archive}/golangci-lint" /usr/local/bin/golangci-lint
          golangci-lint --version

      - name: scripts/checks.sh
        run: ./scripts/checks.sh

  # The price catalog, checked against upstream. Deliberately a second job:
  # it is the one thing here that needs the network, and a fetch failure or an
  # upstream rate change must not be confusable with a gate in checks.sh
  # going red. checks.sh itself stays offline, because the pre-commit hook
  # runs it.
  #
  # What this catches is a published rate moving under a constant in
  # internal/cost. That arrives as a red build instead of as a quietly wrong
  # report, which is the whole reason the extract is pinned rather than
  # fetched at run time.
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: scripts/refresh-prices.sh --check
        run: ./scripts/refresh-prices.sh --check
