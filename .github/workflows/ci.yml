name: checks

# Pushes and pull requests run exactly what the pre-commit hook runs, so
# "it passed locally" and "it passed in CI" mean the same thing. The gates
# themselves live in scripts/checks.sh, not here: a workflow that duplicates
# them is a second definition that drifts.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The dead-code and duplication checks read the repository, and the
          # code-budget check counts committed lines. Depth 1 is enough; the
          # checkpoint reader needs refs only when profiling, not when
          # testing.
          #
          # One gate is weaker here than in the hook, and deliberately: the
          # private-name check needs .private-names, which is gitignored so
          # that a public repository does not publish the list it protects.
          # CI therefore runs the generic patterns only, and the
          # commit-message scan -- the part that would want full history --
          # does not run at all. See AGENTS.md.
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: scripts/checks.sh
        run: ./scripts/checks.sh
